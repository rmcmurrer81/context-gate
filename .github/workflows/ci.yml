name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]

    env:
      CONTEXTGATE_MODE: local
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUTF8: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install contributor dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Test
        run: python -m pytest

      - name: Run read-only diagnostics
        run: python scripts/doctor.py

      - name: Run fictional real-world acceptance matrix
        run: python scripts/acceptance_matrix.py

      - name: Smoke-test CLI
        run: python -m context_gate

      - name: Verify packaged synthetic data
        run: >-
          python -m pip wheel . --no-deps --wheel-dir wheelhouse &&
          python -c "import glob, zipfile;
          names = zipfile.ZipFile(glob.glob('wheelhouse/*.whl')[0]).namelist();
          assert 'context_gate/data/synthetic_context_events.json' in names;
          assert 'context_gate/data/synthetic_action_requests.json' in names;
          assert 'context_gate/company_memory.py' in names;
          assert 'context_gate/semantic_updates.py' in names"

      - name: Smoke-test Streamlit UI
        run: >-
          python -c "from streamlit.testing.v1 import AppTest;
          app = AppTest.from_file('app.py').run(timeout=30);
          assert not app.exception, app.exception"

      - name: Smoke-test bash launcher
        if: runner.os == 'Linux'
        run: bash run.sh doctor

      - name: Smoke-test PowerShell launcher
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\run.ps1 doctor
